name: Render Keep-Alive (Ping Health)

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分鐘執行一次 (防止 Render 15 分鐘閒置休眠)
  workflow_dispatch: # 支援在 GitHub Actions 後台手動點擊執行測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 戳伺服器 /health API 以防止 Render 休眠
        run: |
          echo "正在呼叫 https://prompt-alchemy-server.onrender.com/health ..."
          curl -sS --max-time 120 --retry 3 --retry-delay 10 --retry-connrefused https://prompt-alchemy-server.onrender.com/health
          echo ""
